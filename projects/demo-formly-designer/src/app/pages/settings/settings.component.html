<div class="container">
  <h1>Settings</h1>
  @if (!form.value.backendUrl || !form.value.swaggerUrl) {
    <div class="warning">Enter urls.</div>
  }
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Backend url</mat-label>
      <input matInput formControlName="backendUrl" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Swagger url</mat-label>
      <mat-hint
        >Url to fetch the OpenApi definition for the OpenAPI client</mat-hint
      >
      <input matInput formControlName="swaggerUrl" />
    </mat-form-field>
  </form>
  <div class="buttons">
    <button
      (click)="save()"
      mat-stroked-button
      mat-dialog-close
      color="primary"
    >
      Save
    </button>
  </div>
</div>
