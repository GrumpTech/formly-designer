<button
  pButton
  type="button"
  [disabled]="formControl.disabled"
  (click)="run()"
  [class]="
    props.method === 'delete'
      ? 'p-button-danger delete-button'
      : props.method === 'get'
        ? 'p-button-secondary default-button'
        : 'default-button'
  "
>
  {{ props.label }}
</button>
